[project]
name = 'agent-mission-control'
version = '0.1.1'
description = 'Local-first cross-agent code review workbench and CLI for uncommitted local changes and GitHub PRs'
readme = 'README.md'
license = 'MIT'
license-files = ['LICENSE']
requires-python = '>=3.11'
authors = [
  { name = 'robll-v1' },
]
keywords = [
  'code-review',
  'ai-agents',
  'codex',
  'claude-code',
  'opencode',
  'github-pr',
  'developer-tools',
  'cli',
]
classifiers = [
  'Development Status :: 4 - Beta',
  'Environment :: Console',
  'Environment :: Web Environment',
  'Intended Audience :: Developers',
  'Operating System :: OS Independent',
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Topic :: Software Development :: Quality Assurance',
]
dependencies = [
  'fastapi>=0.116.0',
  'uvicorn>=0.35.0',
  'pydantic>=2.11.0',
  'pyyaml>=6.0.2',
  # The MCP server uses the v1 FastMCP API; MCP 2 renamed it and changed APIs.
  'mcp>=1.0.0,<2',
  'httpx[socks]>=0.27.0',
]

[project.optional-dependencies]
dev = [
  'pytest>=8.0',
]

[project.urls]
Homepage = 'https://github.com/robll-v1/mission-control'
Repository = 'https://github.com/robll-v1/mission-control'
Issues = 'https://github.com/robll-v1/mission-control/issues'

[build-system]
requires = ['setuptools>=77', 'wheel']
build-backend = 'setuptools.build_meta'

[tool.pytest.ini_options]
testpaths = ['backend/tests']
pythonpath = ['backend']

[tool.setuptools]
package-dir = {"" = "backend"}
include-package-data = true

[tool.setuptools.packages.find]
where = ['backend']
include = ['app', 'app.*']
exclude = ['tests', 'tests.*']

[tool.setuptools.package-data]
app = ['static/*', 'static/ui/*', 'static/ui/assets/*']

[project.scripts]
amc = 'app.cli:main'
agent-mission-control = 'app.cli:main'
