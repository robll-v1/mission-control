[project]
name = 'agent-mission-control'
version = '0.1.0'
description = 'Local-first console for multi-round GitHub pull request review'
readme = 'README.md'
requires-python = '>=3.11'
dependencies = [
  'fastapi>=0.116.0',
  'uvicorn>=0.35.0',
  'pydantic>=2.11.0',
  'pyyaml>=6.0.2',
  'mcp>=1.0.0',
  'httpx[socks]>=0.27.0',
]

[build-system]
requires = ['setuptools>=68', 'wheel']
build-backend = 'setuptools.build_meta'


[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[project.scripts]
amc = "app.cli:main"
