name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify imports
        run: |
          python -c "
          import app.cli
          import app.api.app
          import app.core.execution
          import app.core.models
          import app.core.context_compiler
          import app.core.mission_engine
          import app.core.db
          import app.core.worktree
          import app.core.validation
          import app.adapters.opencode_adapter
          import app.services.artifact_store
          import app.services.diff_service
          import app.services.summary_service
          print('All modules imported successfully')
          "
        working-directory: backend

      - name: Verify CLI entry point
        run: |
          amc --help
          amc start --help
          amc stop --help
          amc status --help

      - name: Start backend and health check
        run: |
          amc start --no-browser --no-ui &
          sleep 10
          PORT=$(python -c "import json; print(json.load(open('.run/ports.json'))['backend'])")
          curl -sf http://127.0.0.1:$PORT/api/health | python -c "
          import json, sys
          data = json.load(sys.stdin)
          assert data == {'ok': True}, f'Unexpected: {data}'
          print('Health check passed')
          "
          amc stop

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
