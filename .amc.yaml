repo:
  path: .
  base_branch: main

# No backend section: the backend and model chosen on the model selection page
# (~/.config/amc/config.yaml) apply here, or opencode with its own default model
# when nothing is chosen. Add backend.default / backend.<name>.model only to pin
# them for this repo.

context:
  adaptive_budget: true
  hunk_snippets_enabled: true
  include_recent_commits: 8
  candidate_files_limit: 12
  keywords_limit: 12
  top_level_entries_limit: 12
  include_top_level_entries: false
  hunk_snippet_file_limit: 3
  hunk_snippet_hunks_per_file: 1
  hunk_snippet_context_lines: 8

execution:
  idle_timeout_sec: 180

validation:
  default_mode: standard
  checks:
    build:
      command: ''
      required: false
      modes: ['standard', 'full']
    test:
      command: ''
      required: false
      modes: ['standard', 'full']
